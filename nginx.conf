server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm model/gltf-binary;

    # ---- Security headers (defense in depth; also behind Cloudflare + Traefik) ----
    # NOTE: sub-locations below use only `expires` (never add_header) so these
    # server-level headers keep being inherited everywhere, including index.html.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # index.html must not be cached (SPA shell points at hashed assets)
    location = /index.html {
        expires -1;
    }

    # 3D model: correct MIME for GLTFLoader + long immutable cache
    location ~* \.glb$ {
        default_type model/gltf-binary;
        expires 1y;
        try_files $uri =404;
    }

    # Hashed build assets: long immutable cache
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
